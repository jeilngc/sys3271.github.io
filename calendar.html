                    }

<body class="font-sans antialiased flex flex-col pb-16 min-h-screen">

<!-- Header -->
<header class="w-full z-50 glass-panel border-b border-gray-700 shadow-lg relative">
    <div class="max-w-3xl mx-auto px-4 py-5 flex items-center gap-3">
        <a href="index.html" class="w-9 h-9 rounded-full bg-ice-mid hover:bg-ice-light text-gray-300 hover:text-white flex items-center justify-center transition-colors shrink-0" aria-label="Back to home">
            <i class="fa-solid fa-arrow-left text-sm"></i>
        </a>
        <div>
            <h1 class="font-heading font-black text-xl md:text-2xl tracking-tight text-white uppercase leading-none">
                <i class="fa-solid fa-calendar-days text-frost mr-2"></i>Alliance Calendar
            </h1>
            <p class="text-[11px] text-gray-400 mt-1">All in one place for all SYS alliance events.</p>
        </div>
    </div>
</header>

<main class="flex-grow p-4 w-full max-w-3xl mx-auto z-10 relative mt-4">

    <div class="glass-panel rounded-xl p-4 border border-frost/20">
        <!-- Month nav -->
        <div class="flex items-center justify-between mb-4">
            <button id="cal-prev" class="w-9 h-9 rounded-full bg-ice-mid hover:bg-ice-light text-frost flex items-center justify-center transition-colors" aria-label="Previous month">
                <i class="fa-solid fa-chevron-left text-xs"></i>
            </button>
            <h3 id="cal-month-label" class="font-heading text-white uppercase tracking-wider text-sm"></h3>
            <button id="cal-next" class="w-9 h-9 rounded-full bg-ice-mid hover:bg-ice-light text-frost flex items-center justify-center transition-colors" aria-label="Next month">
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>

        <!-- Weekday labels -->
        <div id="cal-weekdays" class="grid grid-cols-7 gap-1 mb-1 text-center"></div>
        <!-- Day grid -->
        <div id="cal-grid" class="grid grid-cols-7 gap-1"></div>
    </div>

    <!-- Legend — populated dynamically from categories actually in use -->
    <div id="cal-legend" class="flex flex-wrap gap-3 mt-4 px-1"></div>

    <!-- Selected day / upcoming events list -->
    <div class="mt-6">
        <h4 id="cal-list-label" class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Upcoming Events</h4>
        <div id="cal-event-list" class="space-y-2"></div>
    </div>

</main>

    <footer class="text-center py-6 text-gray-600 text-[10px] relative z-10">
        <p>Founded Aug 8, 2025 • Credits: Jei #3271</p>
    </footer>

<!-- Scripts -->
<script src="scripts/calendar.js"></script>
<script src="scripts/pwa.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        initCalendar();
    });
</script>
</body>
</html>
